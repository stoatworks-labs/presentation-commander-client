appId: com.presentationcommander.client
productName: Presentation Commander Client
# Declares this app as a valid .pdf handler at build time (macOS
# CFBundleDocumentTypes, Linux shared-mime-info + .desktop MimeType) — what
# makes "Set as Default PDF App" possible at all on those two platforms.
# Windows self-registers at runtime instead (see defaultPdfHandler.ts) so
# both apps behave the same way there, rather than relying on NSIS's own
# file-association support (which needs nsis.perMachine: true — a bigger,
# unasked-for change to a per-machine/admin install).
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Viewer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!native/*/vendor-sdk'
  - '!native/*/src'
  - '!native/*/scripts'
  - '!native/*/binding.gyp'
  - '!native/*/build/Release/obj.target'
  - '!native/*/build/Release/.deps'
  - '!native/*/build/Makefile'
  - '!native/*/build/binding.Makefile'
  - '!native/*/build/config.gypi'
asarUnpack:
  - resources/**
  - extension/**
  - '**/*.node'
  - '**/*.dll'
win:
  executableName: presentation-commander-client
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-${arch}-portable.${ext}
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc sign every target. Without this electron-builder skips signing
  # entirely when no Developer ID is installed, and Gatekeeper on Apple
  # Silicon then refuses the standalone arm64/x64 builds outright
  # ("is damaged and can't be opened").
  identity: '-'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # Each target needs an explicit arch list. Without one electron-builder
  # builds the host architecture only, which on this Mac silently produced
  # arm64-only Linux packages and no x64 at all.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  maintainer: Allan Sargeant <allan.sargeant@gmail.com>
  category: AudioVideo
appImage:
  # ${arch} is required: without it the x64 and arm64 AppImages resolve to
  # the same filename and the second overwrites the first.
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
